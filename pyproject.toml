[project]
name = "django-harel"
dynamic = ["version"]
description = "Django integration for harel statecharts — a Celery alternative for state-machine-shaped work"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alberto Casado" }]
keywords = ["statechart", "state-machine", "django", "celery", "durable-execution", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.11,<4"
dependencies = [
    "harel>=0.9.0",
    "django>=5.2",
]

[project.urls]
Homepage = "https://github.com/acasadom/django-harel"
Repository = "https://github.com/acasadom/django-harel"
Issues = "https://github.com/acasadom/django-harel/issues"

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "mypy",
    "django-stubs",
    "harel[lsp]>=0.9.0",
    "django-ninja",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/django_harel"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["django_harel"]

[tool.mypy]
files = ["src"]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.uv.sources]
# develop against the harel checkout next to this one (editable): a fix there is seen here at
# once. Published metadata still says harel>=0.9.0; CI checks harel out at ../harel.
harel = { path = "../harel", editable = true }
