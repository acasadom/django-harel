name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - name: Lint (ruff)
        run: make lint
      - name: Type-check (mypy)
        run: make type-check

  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.db }}${{ matrix.django-version && format(', django {0}', matrix.django-version) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        db: [sqlite, postgres, mysql]
        django-version: [""]
        # the floor pyproject.toml declares (django>=5.2): `uv sync` alone always resolves the
        # latest compatible Django, so this is the one job that actually proves 5.2 still works
        include:
          - python-version: "3.11"
            db: sqlite
            django-version: "5.2"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: harel
          POSTGRES_DB: harel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: harel
          MYSQL_DATABASE: harel
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pharel" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HAREL_TEST_DB: ${{ matrix.db }}
      HAREL_TEST_POSTGRES: "127.0.0.1:5432:postgres:harel:harel"
      HAREL_TEST_MYSQL: "127.0.0.1:3306:root:harel:harel"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - name: Pin Django to the matrix version
        if: matrix.django-version != ''
        run: uv pip install "django==${{ matrix.django-version }}.*"
      - name: Run tests
        # UV_NO_SYNC: `uv run` (what `make test` calls) resyncs the environment from the lock
        # before running, which would silently undo the pin above
        env:
          UV_NO_SYNC: "1"
        run: make test
